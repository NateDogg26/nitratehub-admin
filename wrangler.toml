name = "nitratehub-admin-api"
main = "backend/worker.mjs"
compatibility_date = "2026-10-17"
workers_dev = true

[vars]
FRONTEND_ORIGIN = "https://admin.nitratehub.xyz"
API_ORIGIN = "https://admin-api.nitratehub.xyz"
OWNER_DISCORD_ID = "933806891786731640"
DISCORD_CLIENT_ID = "1561145016435474495"

# Production D1 binding.
[[d1_databases]]
binding = "DB"
database_name = "nitratehub-admin"
database_id = "4f123d12-ecef-4d86-9619-951168450792"

[triggers]
crons = ["0 3 * * *"]

[[routes]]
pattern = "admin-api.nitratehub.xyz"
custom_domain = true

[[ratelimits]]
name = "CLIENT_REGISTRATION_LIMITER"
namespace_id = "933806891"
[ratelimits.simple]
limit = 30
period = 60
